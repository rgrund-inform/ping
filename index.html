<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0090a7" />
    <title>Ping — Table Tennis Tournaments</title>
    <meta name="description" content="Plan and run table-tennis tournaments. Works offline." />
    <!-- Link previews (WhatsApp, Slack, …) read these server-side; they are the
         same for every link because the tournament lives in the URL hash. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ping" />
    <meta property="og:title" content="Ping — Table Tennis Tournaments" />
    <meta property="og:description" content="Someone shared a table-tennis tournament with you. Open the link to import it — results included, no account needed." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ping logo: a table-tennis ball and paddle" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply theme before paint to avoid a flash. Default is dark.
      (function () {
        var saved = null
        try { saved = localStorage.getItem('ping.theme') } catch (e) {}
        if (saved !== 'light') document.documentElement.classList.add('app-theme-dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
